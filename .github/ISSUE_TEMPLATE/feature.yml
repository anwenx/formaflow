name: Feature request
description: Propose a feature or implementation task
title: "[FEATURE] "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / goal
      description: What user or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List testable outcomes.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Backend
        - AI extraction
        - Database
        - Shared contracts
        - Testing / documentation
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Dependencies, API contracts, or design references.
    validations:
      required: false
