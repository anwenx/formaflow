name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check scaffold files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f docs/ARCHITECTURE.md
          echo "Documentation scaffold checks passed."

# Once package manifests and a lockfile exist, add setup-node, dependency
# installation, lint, type-check, tests, and build steps. Do not mark those
# checks as required until they exist and pass reliably.
